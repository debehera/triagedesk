[project]
name = "triagedesk"
version = "0.1.0"
description = "IT incident triage and resolution agent built on Claude (CCAR-F capstone)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
# Docs contain illustrative code blocks that must not be auto-formatted
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
